<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docket</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12202b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Docket">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --ink:#12202b; --mute:#5d6b76; --paper:#eef2f4; --white:#fff; --line:#d5dde2;
  --tag:#ffd400; --good:#0f7a43;
  --coles:#e01a22; --woolworths:#178841; --aldi:#f28c28; --costco:#005daa;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--ink);color:#fff;padding:18px 16px 0}
h1{margin:0 0 2px;font-size:24px;font-weight:800;letter-spacing:-.02em}
header p{margin:0 0 12px;color:#aebbc5;font-size:14px}
nav{display:flex;gap:4px}
nav button{flex:1;border:0;background:transparent;color:#aebbc5;font:inherit;font-weight:700;padding:12px 4px;border-bottom:4px solid transparent;cursor:pointer}
nav button[aria-selected=true]{color:#fff;border-color:var(--tag)}
nav .count{background:var(--tag);color:var(--ink);border-radius:10px;padding:0 7px;font-size:12px;margin-left:4px}
main{max-width:720px;margin:0 auto;padding:16px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--costco);outline-offset:2px}
.add{position:relative;margin-bottom:12px}
.add input{width:100%;font:inherit;padding:14px;border:2px solid var(--ink);border-radius:8px;background:#fff}
.sugg{position:absolute;left:0;right:0;top:100%;background:#fff;border:2px solid var(--ink);border-top:0;border-radius:0 0 8px 8px;z-index:5;max-height:260px;overflow:auto}
.sugg button{display:block;width:100%;text-align:left;border:0;background:#fff;font:inherit;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.sugg button:hover{background:var(--paper)}
.empty{color:var(--mute);padding:28px 8px;text-align:center}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px}
.row:first-child{border-radius:8px 8px 0 0}.row:last-child{border-radius:0 0 8px 8px;border-bottom:0}
.row .name{flex:1;min-width:0}
.row .name small{display:block;color:var(--mute);font-size:13px}
.qty{display:flex;align-items:center;gap:6px}
.qty button,.icon{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;font-size:18px;line-height:1;cursor:pointer;color:var(--ink)}
.icon.on{background:var(--tag);border-color:var(--tag)}
.icon.x{border-color:var(--line);color:var(--mute)}
.qty b{min-width:20px;text-align:center}
h2{font-size:18px;margin:22px 0 8px}
.stores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.store{background:#fff;border-top:6px solid var(--c);padding:10px 12px;border-radius:0 0 8px 8px}
.store.best{outline:3px solid var(--good)}
.store .n{font-weight:800}
.store .t{font-size:26px;font-weight:800;letter-spacing:-.02em}
.store .s{font-size:13px;color:var(--mute)}
.store .flag{display:inline-block;background:var(--good);color:#fff;font-size:12px;font-weight:700;padding:1px 8px;border-radius:10px;margin-bottom:4px}
.split{background:var(--ink);color:#fff;border-radius:8px;padding:14px;margin-top:10px}
.split b{font-size:22px;color:var(--tag)}
.split p{margin:4px 0 0;color:#c9d3da;font-size:14px}
.item{background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.item h3{margin:0 0 6px;font-size:16px}
.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.p{border-top:4px solid var(--c);padding:4px 2px;font-size:15px;font-weight:700;border-radius:2px;background:var(--paper)}
.p small{display:block;font-weight:400;color:var(--mute);font-size:11px;line-height:1.2}
.p.min{background:#d9f2e3;color:var(--good)}
.p.na{color:#a3afb8;font-weight:400}
.sale{display:inline-block;background:var(--tag);color:var(--ink);font-size:11px;font-weight:800;padding:0 5px;border-radius:3px}
.note{font-size:13px;color:var(--mute);margin:10px 2px}
.deal{display:flex;gap:12px;align-items:center;background:#fff;border-left:8px solid var(--tag);padding:10px 12px;margin-bottom:8px;border-radius:0 8px 8px 0}
.deal .name{flex:1}
.deal .pr{text-align:right;font-weight:800;font-size:18px}
.deal .pr s{display:block;color:var(--mute);font-weight:400;font-size:13px}
.target{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);margin-top:4px}
.target input{width:72px;font:inherit;padding:4px 6px;border:1.5px solid var(--line);border-radius:6px}
.banner{background:var(--tag);padding:12px 14px;border-radius:8px;font-weight:700;margin-bottom:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:5px}
.demo{background:#fff3cd;color:#6b5400;font-size:13px;padding:8px 16px;text-align:center}
.th{width:48px;height:48px;border-radius:8px;background:var(--paper);display:grid;place-items:center;font-size:26px;position:relative;overflow:hidden;flex:none}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.th.lg{width:100%;height:170px;font-size:80px;border-radius:0}
.th.sm{width:40px;height:40px;font-size:22px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.syncbtn{flex:none;border:1.5px solid #aebbc5;background:transparent;color:#fff;font:inherit;font-size:13px;font-weight:700;padding:6px 12px;border-radius:16px;cursor:pointer;margin-top:4px}
.syncbtn.ok{border-color:#5bd68b;color:#5bd68b}.syncbtn.error{border-color:var(--tag);color:var(--tag)}
.field{display:block;margin:10px 0}.field span{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
.field input{width:100%;font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:8px}
.sheet .body p{margin:6px 0}
.addrow{display:flex;gap:8px;align-items:stretch}.addrow .add{flex:1;margin-bottom:12px}
.scanbtn{flex:none;width:52px;margin-bottom:12px;border:2px solid var(--ink);background:#fff;border-radius:8px;font-size:22px;cursor:pointer}
.cam{position:relative;background:#000;border-radius:8px;overflow:hidden;aspect-ratio:4/3;margin:8px 0}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.aim{position:absolute;left:10%;right:10%;top:34%;bottom:34%;border:3px solid var(--tag);border-radius:8px;pointer-events:none}
.found{display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:8px;padding:10px;margin:10px 0}
.found .th{width:64px;height:64px}
.pill{border:2px solid var(--ink);background:#fff;font:inherit;font-weight:700;padding:12px;border-radius:8px;cursor:pointer}
.pill[disabled]{color:var(--good);border-color:var(--good);cursor:default}
.link{background:none;border:0;padding:0;font:inherit;font-weight:700;color:inherit;text-align:left;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chips button{flex:none;border:1.5px solid var(--ink);background:#fff;font:inherit;font-size:14px;font-weight:700;padding:6px 12px;border-radius:18px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:#fff;border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.tile .th{width:100%;height:84px;border-radius:0;font-size:40px}
.tile .info{padding:6px 8px;font-size:13px;line-height:1.25;flex:1}
.tile .info b{display:block}
.tile .info span{color:var(--mute)}
.tile button.add-btn{border:0;border-top:1px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:13px;padding:8px;cursor:pointer}
.tile button.add-btn[disabled]{color:var(--good);cursor:default}
.overlay{position:fixed;inset:0;background:rgba(18,32,43,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;position:relative}
.sheet .close{position:absolute;top:10px;right:10px;z-index:2;background:#fff}
.sheet .body{padding:14px 16px 24px}
.sheet h2{margin:0 0 2px;font-size:22px}
.sheet .meta{color:var(--mute);font-size:14px;margin-bottom:12px}
.srow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;border-top:4px solid var(--c);background:var(--paper);padding:8px 10px;margin-bottom:8px;border-radius:2px}
.srow .pn{font-size:13px;color:var(--mute)}
.srow .pp{font-weight:800;font-size:18px;text-align:right}
.srow .pp s{font-weight:400;font-size:13px;color:var(--mute);margin-right:4px}
.srow .up{font-size:13px;text-align:right;color:var(--mute)}
.srow.best{background:#d9f2e3}
.srow.best .up{color:var(--good);font-weight:700}
.srow a{color:var(--costco);font-size:13px}
@media (min-width:600px){.stores{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:no-preference){.store.best{transition:outline-color .2s}}
</style>
</head>
<body>
<header>
  <div class="top"><div><h1>Docket</h1>
  <p>Coles, Woolworths, Aldi and Costco side by side</p></div><button id="syncbtn" class="syncbtn" data-sync-open="1"></button></div>
  <nav role="tablist" id="tabs"></nav>
</header>
<div class="demo" id="demo"></div>
<main id="app"></main>
<div id="sheet"></div>
<div id="scan"></div>

<script>
/* ---------- STORES ---------- */
const STORES=[
  {id:'coles',name:'Coles'},
  {id:'woolworths',name:'Woolworths'},
  {id:'aldi',name:'Aldi'},
  {id:'costco',name:'Costco'}
];
const css=getComputedStyle(document.documentElement);
const col=id=>css.getPropertyValue('--'+id).trim();

/* ---------- PRICE DATA ----------
   Sample prices for now. When the scraper is running, it writes prices.json
   in this same shape and the app loads it automatically.
   Each store entry: [price, packQty, packLabel, wasPrice?]  (null = not stocked)
   "need" is the amount one list item means, in the base unit (L, kg or each). */
const SAMPLE=[
 {id:'milk',name:'Full cream milk',base:'L',need:2,s:[[3.10,2,'2L'],[3.10,2,'2L'],[2.55,2,'2L'],[7.49,6,'6L']]},
 {id:'eggs',name:'Free range eggs',base:'each',need:12,s:[[6.50,12,'12 pack'],[6.50,12,'12 pack'],[5.49,12,'12 pack'],[9.49,24,'24 pack']]},
 {id:'bread',name:'White sandwich loaf',base:'each',need:1,s:[[3.50,1,'700g'],[3.50,1,'700g'],[2.49,1,'700g'],[6.49,2,'2 pack']]},
 {id:'butter',name:'Butter',base:'kg',need:.5,s:[[6.40,.5,'500g'],[5.00,.5,'500g',7.50],[4.99,.5,'500g'],[9.99,1,'1kg']]},
 {id:'banana',name:'Bananas',base:'kg',need:1,s:[[3.90,1,'1kg'],[3.90,1,'1kg'],[3.49,1,'1kg'],[3.99,1,'1kg']]},
 {id:'chicken',name:'Chicken breast fillets',base:'kg',need:1,s:[[11.00,1,'1kg'],[8.50,1,'1kg',13.00],[9.99,1,'1kg'],[8.99,1,'1kg']]},
 {id:'mince',name:'Beef mince',base:'kg',need:.5,s:[[7.50,.5,'500g'],[7.50,.5,'500g'],[6.79,.5,'500g'],[25.99,2,'2kg']]},
 {id:'pasta',name:'Spaghetti',base:'kg',need:.5,s:[[1.80,.5,'500g'],[1.80,.5,'500g'],[0.99,.5,'500g'],[6.99,2,'4 x 500g']]},
 {id:'rice',name:'Basmati rice',base:'kg',need:1,s:[[3.20,1,'1kg'],[3.20,1,'1kg'],[2.49,1,'1kg'],[12.99,5,'5kg']]},
 {id:'cheese',name:'Tasty cheese',base:'kg',need:.5,s:[[7.00,.5,'500g'],[5.50,.5,'500g',9.00],[5.49,.5,'500g'],[10.99,1,'1kg']]},
 {id:'tomato',name:'Canned tomatoes',base:'each',need:1,s:[[1.10,1,'400g'],[1.10,1,'400g'],[0.79,1,'400g'],[10.99,12,'12 pack']]},
 {id:'oil',name:'Extra virgin olive oil',base:'L',need:1,s:[[12.00,1,'1L'],[9.50,1,'1L',15.00],[8.99,1,'1L'],[17.99,2,'2L']]},
 {id:'tp',name:'Toilet paper',base:'roll',need:12,s:[[9.00,12,'12 rolls'],[9.00,12,'12 rolls'],[6.99,12,'12 rolls'],[24.99,30,'30 rolls']]},
 {id:'weet',name:'Wheat biscuit cereal',base:'kg',need:1.2,s:[[5.50,1.2,'1.2kg'],[5.50,1.2,'1.2kg'],[3.99,1.2,'1.2kg'],[8.99,1.8,'1.8kg']]},
 {id:'yog',name:'Greek yoghurt',base:'kg',need:1,s:[[5.50,1,'1kg'],[5.50,1,'1kg'],[3.99,1,'1kg'],[7.99,2,'2kg']]},
 {id:'peas',name:'Frozen peas',base:'kg',need:1,s:[[3.50,1,'1kg'],[3.50,1,'1kg'],[2.79,1,'1kg'],[5.99,2,'2kg']]},
 {id:'onion',name:'Brown onions',base:'kg',need:1,s:[[2.50,1,'1kg'],[2.50,1,'1kg'],[1.99,1,'1kg'],[5.49,3,'3kg']]},
 {id:'potato',name:'Potatoes',base:'kg',need:2,s:[[5.00,2,'2kg'],[5.00,2,'2kg'],[3.99,2,'2kg'],[7.99,4,'4kg']]},
 {id:'laundry',name:'Laundry liquid',base:'L',need:2,s:[[12.00,2,'2L'],[9.00,2,'2L',16.00],[8.99,2,'2L'],[22.99,4,'4L']]},
 {id:'oj',name:'Orange juice',base:'L',need:2,s:[[4.50,2,'2L'],[4.50,2,'2L'],[3.29,2,'2L'],[8.99,3,'3L']]},
 {id:'tuna',name:'Tuna in springwater',base:'each',need:1,s:[[1.60,1,'95g'],[1.60,1,'95g'],[1.19,1,'95g'],[14.99,12,'12 pack']]},
 {id:'apple',name:'Pink Lady apples',base:'kg',need:1,s:[[5.90,1,'1kg'],[5.90,1,'1kg'],[4.99,1,'1kg'],[6.49,2,'2kg']]},
 {id:'bacon',name:'Short cut bacon',base:'kg',need:.25,s:[[5.50,.25,'250g'],[5.50,.25,'250g'],[4.49,.25,'250g'],[17.99,1,'1kg']]}
];
/* Extra detail per product. When the scraper runs it can supply real values:
   img (picture URL), brand, desc, and a product name + link per store. */
const EXTRA={
 milk:['🥛','Dairy & eggs'],eggs:['🥚','Dairy & eggs'],bread:['🍞','Bakery'],butter:['🧈','Dairy & eggs'],
 banana:['🍌','Fruit & veg'],chicken:['🍗','Meat'],mince:['🥩','Meat'],pasta:['🍝','Pantry'],rice:['🍚','Pantry'],
 cheese:['🧀','Dairy & eggs'],tomato:['🥫','Pantry'],oil:['🫒','Pantry'],tp:['🧻','Household'],weet:['🥣','Pantry'],
 yog:['🥛','Dairy & eggs'],peas:['🟢','Frozen'],onion:['🧅','Fruit & veg'],potato:['🥔','Fruit & veg'],
 laundry:['🧺','Household'],oj:['🧃','Drinks'],tuna:['🐟','Pantry'],apple:['🍎','Fruit & veg'],bacon:['🥓','Meat']
};
const BRAND=['Coles','Woolworths','Aldi','Kirkland Signature'];
SAMPLE.forEach(p=>{
  const x=EXTRA[p.id]||['🛒','Other'];
  p.emoji=p.emoji||x[0];p.cat=p.cat||x[1];
  p.s.forEach((e,i)=>{if(e&&!e[4])e[4]=BRAND[i]+' '+p.name+' '+e[2]});
});
let CATALOG=SAMPLE, DEMO=true, META=null;

/* ---------- STATE ---------- */
let state={doc:{items:{},watch:{},track:{}},list:[],watch:{},tab:'list',sync:null};
let ui={open:null,cat:'All',sync:false,msg:''};
const now=()=>Date.now();
try{
  const s=localStorage.getItem('trolley2');
  if(s){const j=JSON.parse(s);state.doc=j.doc||state.doc;state.doc.track=state.doc.track||{};state.sync=j.sync||null;state.tab=j.tab||'list'}
  else{const o=localStorage.getItem('trolley');if(o){const j=JSON.parse(o);   // migrate the earlier single-device list
    (j.list||[]).forEach((l,n)=>state.doc.items[l.id]={qty:l.qty,t:now(),a:now()+n});
    Object.entries(j.watch||{}).forEach(([id,t])=>state.doc.watch[id]={target:t,t:now()})}}
}catch(e){}
const save=()=>{try{localStorage.setItem('trolley2',JSON.stringify({doc:state.doc,sync:state.sync,tab:state.tab}))}catch(e){}};
// The list and watchlist are stored as a small document where every entry carries a timestamp,
// so two people's edits can be merged without overwriting each other.
function setItem(id,qty){const it=state.doc.items[id];state.doc.items[id]={qty,t:now(),a:it&&!it.del?it.a:now()}}
function delItem(id){const it=state.doc.items[id];state.doc.items[id]={qty:0,t:now(),a:(it&&it.a)||now(),del:true}}
function setWatch(id,target){state.doc.watch[id]={target:target==null?null:target,t:now()}}
function unwatch(id){state.doc.watch[id]={target:null,t:now(),del:true}}
function addTrack(t){state.doc.track[t.code]={code:t.code,name:t.name,brand:t.brand||'',size:t.size||'',t:now()}}
function delTrack(code){const x=state.doc.track[code];state.doc.track[code]={code,name:x?x.name:'',t:now(),del:true}}
function derive(){
  state.tracked=Object.values(state.doc.track||{}).filter(v=>!v.del).sort((a,b)=>a.t-b.t);
  state.list=Object.entries(state.doc.items).filter(([id,v])=>!v.del&&byId(id)).sort((x,y)=>x[1].a-y[1].a).map(([id,v])=>({id,qty:v.qty}));
  state.watch={};Object.entries(state.doc.watch).forEach(([id,v])=>{if(!v.del)state.watch[id]=v.target});
}

/* ---------- HELPERS ---------- */
const $=s=>document.querySelector(s);
const money=n=>'$'+n.toFixed(2);
const byId=id=>CATALOG.find(p=>p.id===id);
// cost of what you need, pro-rated from the pack price
const cost=(p,i,qty=1)=>{const e=p.s[i];return e?e[0]/e[1]*p.need*qty:null};
const onSale=e=>e&&((e[3]&&e[3]>e[0])||e[6]===1);
const thumb=(p,cls='')=>`<div class="th ${cls}" aria-hidden="true">${p.emoji||'🛒'}${p.img?`<img src="${esc(p.img)}" alt="" loading="lazy" onerror="this.remove()">`:''}</div>`;
const unitPrice=(p,i)=>{const e=p.s[i];if(!e)return null;const u=e[0]/e[1];
  if(p.base==='kg')return {v:u/10,t:'/100g',raw:u};if(p.base==='L')return {v:u/10,t:'/100mL',raw:u};
  return {v:u,t:'/'+(p.base==='each'?'each':p.base),raw:u}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function deals(){
  const out=[];
  CATALOG.forEach(p=>p.s.forEach((e,i)=>{
    const watched=p.id in state.watch, target=state.watch[p.id];
    const hitTarget=watched&&target&&cost(p,i)!==null&&e[0]/e[1]*p.need<=target;
    if(onSale(e)||hitTarget)out.push({p,i,e,watched,hitTarget,onList:state.list.some(l=>l.id===p.id)});
  }));
  out.sort((a,b)=>(b.watched-a.watched)||(b.onList-a.onList));
  return out;
}
const alertCount=()=>deals().filter(d=>d.watched||d.onList).length;

/* ---------- VIEWS ---------- */
function tabs(){
  const n=alertCount();
  $('#tabs').innerHTML=[['list','List'],['compare','Compare'],['deals','Deals']].map(([id,l])=>
   `<button role="tab" aria-selected="${state.tab===id}" data-tab="${id}">${l}${id==='deals'&&n?`<span class="count">${n}</span>`:''}</button>`).join('');
}

function viewList(){
  const rows=state.list.map(l=>{const p=byId(l.id);return `
   <div class="row">
    ${thumb(p)}<div class="name"><button class="link" data-open="${p.id}">${esc(p.name)}</button><small>${p.need} ${p.base==='each'?'':p.base}${p.base==='each'&&p.need>1?' pack':''}</small></div>
    <button class="icon ${p.id in state.watch?'on':''}" data-watch="${p.id}" aria-label="Alert me about specials on ${esc(p.name)}" title="Alert me about specials">★</button>
    <div class="qty"><button data-dec="${p.id}" aria-label="Fewer">−</button><b>${l.qty}</b><button data-inc="${p.id}" aria-label="More">+</button></div>
    <button class="icon x" data-del="${p.id}" aria-label="Remove ${esc(p.name)}">×</button>
   </div>`}).join('');
  return `
   <div class="addrow"><div class="add"><input id="q" placeholder="Add an item, e.g. milk" autocomplete="off" aria-label="Add an item"><div class="sugg" id="sugg" hidden></div></div>
     <button class="scanbtn" data-scan-open="1" aria-label="Scan a barcode" title="Scan a barcode">📷</button></div>
   ${rows?`<div>${rows}</div><p class="note">Tap ★ to get an alert when an item goes on special. Tap a name for details.</p>`:`<div class="empty">Your list is empty. Search above or pick from the products below.</div>`}

function viewCompare(){
  if(!state.list.length)return `<div class="empty">Add items to your list to compare stores.</div>`;
  const items=state.list.map(l=>({p:byId(l.id),qty:l.qty}));
  const tot=STORES.map((s,i)=>{
    let t=0,miss=0;items.forEach(({p,qty})=>{const c=cost(p,i,qty);c===null?miss++:t+=c});
    return {s,i,t,miss};
  });
  const ranked=[...tot].sort((a,b)=>a.miss-b.miss||a.t-b.t);
  const best=ranked[0];
  let split=0;
  items.forEach(({p,qty})=>{const cs=STORES.map((_,i)=>cost(p,i,qty)).filter(c=>c!==null);split+=Math.min(...cs)});
  const saved=best.t-split;
  const cards=tot.map(x=>`
   <div class="store ${x===best?'best':''}" style="--c:${col(x.s.id)}">
    ${x===best?'<span class="flag">Cheapest</span>':''}
    <div class="n">${x.s.name}</div><div class="t">${money(x.t)}</div>
    <div class="s">${x.miss?x.miss+' item'+(x.miss>1?'s':'')+' not stocked':'Has everything'}</div>
   </div>`).join('');
  const rows=items.map(({p,qty})=>{
    const cs=STORES.map((_,i)=>cost(p,i,qty));
    const min=Math.min(...cs.filter(c=>c!==null));
    return `<div class="item"><h3 style="display:flex;align-items:center;gap:10px">${thumb(p,'sm')}<button class="link" data-open="${p.id}">${esc(p.name)}${qty>1?' × '+qty:''}</button></h3><div class="prices">${
      STORES.map((s,i)=>{const e=p.s[i],c=cs[i];
        if(c===null)return `<div class="p na" style="--c:${col(s.id)}">–<small>${s.name}</small></div>`;
        return `<div class="p ${c===min?'min':''}" style="--c:${col(s.id)}">${money(c)}<small>${s.name}${i===3?' · '+e[2]:''}</small>${onSale(e)?'<span class="sale">SPECIAL</span>':''}</div>`}).join('')
    }</div></div>`}).join('');
  return `
   <div class="stores">${cards}</div>
   <div class="split">Shop at the cheapest store for each item: <b>${money(split)}</b>
    <p>${saved>0.005?`That is ${money(saved)} less than shopping only at ${best.s.name}.`:`${best.s.name} alone is already the cheapest.`}</p></div>
   <h2>Item by item</h2>${rows}
   <p class="note">Costco prices are worked out per unit for the amount you need. Costco sells bigger packs and needs a membership, so the pack price you pay is higher than shown.</p>`;
}

// The scanner lives outside render() so the camera keeps running while the list updates or syncs.
let scanStream=null,scanTimer=null,scanLocked=false,scanItem=null,zxingReady=null;
const loadZXing=()=>zxingReady||(zxingReady=new Promise((ok,no)=>{if(window.ZXing)return ok();const s=document.createElement('script');s.src='zxing.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)}));
function openScan(){
  ui.scan=true;scanItem=null;scanLocked=false;
  $('#scan').innerHTML=`<div class="overlay" data-scan-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Scan a barcode">
    <button class="icon close" data-scan-close="1" aria-label="Close">×</button>
    <div class="body" style="padding-top:20px"><h2>Scan a barcode</h2>
    <div class="cam"><video id="cam" playsinline muted></video><div class="aim"></div></div>
    <p class="note" id="cam-msg">Starting the camera…</p>
    <label class="field"><span>Or type the number under the barcode</span><div style="display:flex;gap:8px"><input id="bc" inputmode="numeric" placeholder="e.g. 9300633500313"><button class="pill" data-scan-manual="1" style="padding:8px 14px">Look up</button></div></label>
    <div id="scan-result"></div></div></div></div>`;
  startCamera();

function stopCamera(){clearInterval(scanTimer);scanTimer=null;if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
function closeScan(){ui.scan=false;stopCamera();$('#scan').innerHTML=''}
function scanDone(msg){scanItem=null;scanLocked=false;const r=$('#scan-result');if(r)r.innerHTML=msg?`<p style="color:var(--good);font-weight:700">${esc(msg)}</p>`:'';}
async function startCamera(){
  const msg=$('#cam-msg');
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('no camera');
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    if(!ui.scan){stopCamera();return}
    const v=$('#cam');v.srcObject=scanStream;await v.play();
    msg.textContent='Point the camera at the barcode.';
    if('BarcodeDetector' in window){
      const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});
      scanTimer=setInterval(async()=>{if(scanLocked||!v.videoWidth)return;try{const r=await det.detect(v);if(r[0])onCode(r[0].rawValue)}catch(e){}},300);
    }else{
      await loadZXing();
      const Z=window.ZXing,hints=new Map();
      hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);
      hints.set(Z.DecodeHintType.TRY_HARDER,true);
      const reader=new Z.MultiFormatReader();reader.setHints(hints);
      const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
      scanTimer=setInterval(()=>{if(scanLocked||!v.videoWidth)return;
        cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
        try{const bmp=new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(cv)));onCode(reader.decode(bmp).getText())}catch(e){}},300);
    }
  }catch(e){msg.textContent='The camera isn\'t available here. Allow camera access, or type the number below.'}
}
async function lookupBarcode(code){
  try{
    const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,brands,quantity,image_front_small_url');
    const j=await r.json();
    if(j.status===1&&j.product&&j.product.product_name)
      return {code,name:j.product.product_name.trim(),brand:(j.product.brands||'').split(',')[0].trim(),size:(j.product.quantity||'').trim(),img:j.product.image_front_small_url||''};
    return {code,notFound:true};
  }catch(e){return {code,error:true}}
}
// Which of Docket's items could this product be? Uses the same include/exclude words the price scraper uses.
function catalogMatches(p){
  const t=[p.brand,p.name,p.size].join(' ').toLowerCase();
  return CATALOG.filter(c=>{
    const m=c.match;
    if(m&&m.include&&m.include.length)return m.include.every(w=>w.toLowerCase().split('|').some(x=>t.includes(x)))&&!(m.exclude||[]).some(w=>t.includes(w.toLowerCase()));
    return c.name.toLowerCase().split(/\s+/).every(w=>t.includes(w));
  }).slice(0,3);
}
let lastCode='',lastAt=0;
async function onCode(code){
  if(scanLocked)return;
  if(code===lastCode&&Date.now()-lastAt<4000)return;   // don't re-read the barcode you just handled
  lastCode=code;lastAt=Date.now();scanLocked=true;
  const box=$('#scan-result');if(!box)return;
  box.innerHTML=`<p class="note">Looking up ${esc(code)}…</p>`;
  const p=await lookupBarcode(code);
  if(!ui.scan)return;
  const th=p.img?`<div class="th">🛒<img src="${esc(p.img)}" alt="" onerror="this.remove()"></div>`:'<div class="th">🛒</div>';
  if(p.error){box.innerHTML=`<p class="note">Couldn't reach the product database. Check your connection and try again.</p><button class="pill" data-scan-again="1" style="width:100%">Scan again</button>`;return}
  if(p.notFound){
    scanItem={code,name:'',brand:'',size:''};
    box.innerHTML=`<p class="note">That barcode (${esc(code)}) isn't in the free product database. Type what it is and save it.</p>
      <label class="field"><span>Product name</span><input id="scan-name" placeholder="e.g. Vegemite 380g"></label>
      <div style="display:flex;gap:8px"><button class="pill" data-scan-track="1" style="flex:1">Save to track</button><button class="pill" data-scan-again="1" style="flex:1">Scan again</button></div>`;return}
  scanItem=p;
  const ms=catalogMatches(p);
  box.innerHTML=`<div class="found">${th}<div><b>${esc(p.name)}</b><div class="note" style="margin:2px 0 0">${esc([p.brand,p.size].filter(Boolean).join(' · '))}</div></div></div>
    ${ms.length?`<p class="note">Docket compares this type of item across stores, not the exact brand.</p>`+ms.map(c=>`<button class="pill" data-scan-add="${esc(c.id)}" style="width:100%;margin-bottom:8px">${state.list.some(l=>l.id===c.id)?'Already on your list: ':'Add to list: '}${esc(c.name)}</button>`).join(''):`<p class="note">This isn't one of the items Docket compares yet.</p>`}
    <div style="display:flex;gap:8px"><button class="pill" data-scan-track="1" style="flex:1">Save to track</button><button class="pill" data-scan-again="1" style="flex:1">Scan again</button></div>`;
}

/* ---------- SYNC (optional: lets two people share one list) ---------- */
let syncStatus='off',syncBusy=false,syncAgain=false,syncDebounce=null;
const newCode=()=>Array.from(crypto.getRandomValues(new Uint8Array(18)),b=>b.toString(36).padStart(2,'0')).join('');
const rpc=async(fn,body)=>{
  const r=await fetch(state.sync.url.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json',apikey:state.sync.key},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('HTTP '+r.status);const t=await r.text();return t?JSON.parse(t):null};
// Merge two copies: for each entry the most recent change wins, and deletions are remembered for 30 days.
function merge(a,b){
  const out={items:{},watch:{},track:{}};
  for(const k of ['items','watch','track']){
    const x0=a[k]||{},y0=b[k]||{};
    new Set([...Object.keys(x0),...Object.keys(y0)]).forEach(id=>{
      const x=x0[id],y=y0[id];
      const w=!x?y:!y?x:(y.t>x.t||(y.t===x.t&&y.del&&!x.del))?y:x;
      if(w.del&&now()-w.t>30*864e5)return;
      out[k][id]=w});}
  return out}
const canon=d=>JSON.stringify(d,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort()):v);
function setStatus(s){
  syncStatus=s;const b=$('#syncbtn');if(!b)return;
  if(!state.sync)s='off';
  b.className='syncbtn '+s;b.textContent={off:'Sync off',ok:'Synced',error:'Sync problem',busy:'Syncing…'}[s];}
async function sync(){
  if(!state.sync)return setStatus('off');
  if(syncBusy){syncAgain=true;return}
  syncBusy=true;setStatus('busy');
  try{
    const remote=(await rpc('get_household',{p_code:state.sync.code}))||{};
    remote.items=remote.items||{};remote.watch=remote.watch||{};remote.track=remote.track||{};
    state.doc.track=state.doc.track||{};const merged=merge(state.doc,remote),changed=canon(merged)!==canon(state.doc);
    state.doc=merged;
    if(canon(merged)!==canon(remote))await rpc('save_household',{p_code:state.sync.code,p_data:merged});
    if(changed){save();render()}
    setStatus('ok');
  }catch(e){setStatus('error')}
  finally{syncBusy=false;if(syncAgain){syncAgain=false;sync()}}
}
function queueSync(){if(!state.sync)return;clearTimeout(syncDebounce);syncDebounce=setTimeout(sync,600)}
setInterval(()=>{if(!document.hidden)sync()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
// An invite link carries the connection details after the # so a second device can join with one tap.
try{const m=location.hash.match(/^#sync=(.+)$/);
  if(m){const j=JSON.parse(atob(m[1]));if(j.url&&j.key&&j.code){state.sync={url:j.url,key:j.key,code:j.code};save()}history.replaceState(null,'',location.pathname)}}catch(e){}

function viewSync(){
  const s=state.sync,msg=ui.msg?`<p style="color:var(--good);font-weight:700">${esc(ui.msg)}</p>`:'';
  const body=s?`
    <p>Syncing is on. Anyone with the invite link can add to and edit this list.</p>${msg}
    <div style="display:flex;gap:8px;margin-top:12px"><button class="pill" data-sync-copy="1" style="flex:1">Copy invite link</button><button class="pill" data-sync-stop="1" style="flex:1">Stop syncing</button></div>
    <p class="note">Status: ${({ok:'up to date',error:'could not reach the sync service, will retry',busy:'syncing',off:'off'})[syncStatus]}</p>`
  :`<p>Share one list between your devices. Set up the free sync service once (see README), then enter its details here. Your partner joins from an invite link.</p>${msg}
    <label class="field"><span>Project URL</span><input id="s-url" placeholder="https://xxxx.supabase.co" inputmode="url" autocapitalize="off"></label>
    <label class="field"><span>Public key</span><input id="s-key" autocapitalize="off"></label>
    <label class="field"><span>Household code</span><input id="s-code" autocapitalize="off"></label>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="pill" data-sync-gen="1" style="flex:1">Make a code</button><button class="pill" data-sync-save="1" style="flex:1">Start syncing</button></div>`;
  return `<div class="overlay" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="Sync"><button class="icon close" data-close="1" aria-label="Close">×</button><div class="body" style="padding-top:20px"><h2>Sync with your household</h2>${body}</div></div></div>`;
}

render();
sync();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
