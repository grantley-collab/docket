name: Update prices
on:
  schedule:
    - cron: '0 20 * * *'      # 6:00am Brisbane time every day
  workflow_dispatch:
    inputs:
      discover:
        description: 'Re-pick the matching products in each store'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scrape.mjs ${{ inputs.discover && 'discover' || '' }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: ${{ vars.APP_URL }}
      - run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add docs matches.json state.json
          git diff --staged --quiet || (git commit -m "Update prices" && git push)
